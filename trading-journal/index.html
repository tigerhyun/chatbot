<title>나의 매매일지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@800&display=swap">
<style>
/* Layout: 한 줄 장부(ledger) — 위에 목표 진행, 아래 탭으로 보유/기록/통계/원칙. 상승=빨강, 하락=파랑(국내 시장 관례) */
:root {
  --paper: #f3f5f2; --surface: #ffffff; --sunken: #e9ede8; --ink: #17201c; --muted: #5b6862; --line: #d9dfd8;
  --accent: #2b5a4b; --accent-ink: #ffffff; --accent-soft: #dfeae5;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --up: #d1323c; --down: #2a5fc4; --warn: #9a6512; --warn-bg: #fbf2df; --bad: #b4232c; --bad-bg: #fbe5e6;
  --f-display: "Nanum Myeongjo", "Batang", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101513; --surface: #171e1b; --sunken: #0c100e; --ink: #e4ebe7; --muted: #94a29b; --line: #29322e;
  --accent: #82c2ac; --accent-ink: #0d1814; --accent-soft: #1d2d27;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --up: #ff6e76; --down: #72a0ff; --warn: #e3b45e; --warn-bg: #2a2315; --bad: #ff7d84; --bad-bg: #2e1718; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #101513; --surface: #171e1b; --sunken: #0c100e; --ink: #e4ebe7; --muted: #94a29b; --line: #29322e;
  --accent: #82c2ac; --accent-ink: #0d1814; --accent-soft: #1d2d27;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --up: #ff6e76; --down: #72a0ff; --warn: #e3b45e; --warn-bg: #2a2315; --bad: #ff7d84; --bad-bg: #2e1718; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
h1 { font-family: var(--f-display); font-size: 30px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; font-weight: 600; text-wrap: balance; }
h3 { font-size: 14px; margin: 0; font-weight: 600; }
.label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
button, .btn { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; font-weight: 500; }
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:disabled { opacity: 0.45; cursor: not-allowed; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
button.danger { color: var(--bad); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 72px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; }
.goal-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
.goal-big { font-family: var(--f-num); font-size: 22px; font-weight: 500; }
.bar { height: 10px; background: var(--sunken); border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; min-width: 2px; }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--f-num); }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted); padding: 10px 12px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.count { font-family: var(--f-num); font-size: 12px; margin-left: 4px; }

.list { display: grid; gap: 12px; }
.trade { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.trade-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.trade-name { font-size: 17px; font-weight: 600; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 16px; }
.kv div { display: grid; gap: 1px; min-width: 0; }
.kv b { font-family: var(--f-num); font-weight: 500; font-variant-numeric: tabular-nums; }
.reason { background: var(--sunken); border-radius: 8px; padding: 8px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline-price { display: flex; gap: 6px; align-items: center; }
.inline-price input { width: 140px; padding: 6px 8px; }

.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 28px 20px; display: grid; gap: 10px; justify-items: start; }
.empty p { margin: 0; max-width: 60ch; }
.notice { border-radius: 10px; padding: 12px 14px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font-family: var(--f-num); font-size: 20px; font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num { font-family: var(--f-num); }
.insight { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 0; }

.rules { display: grid; gap: 8px; }
.rule-row { display: flex; gap: 8px; align-items: center; }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; align-content: start; }
.field > span { font-size: 13px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(600px, calc(100% - 32px)); max-height: calc(100% - 32px); }
dialog::backdrop { background: rgba(10, 14, 12, 0.5); }
.dlg { padding: 20px; display: grid; gap: 14px; }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.checks { display: grid; gap: 6px; background: var(--sunken); border-radius: 10px; padding: 12px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.checks input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.live { display: grid; gap: 6px; }
.live div { font-size: 14px; border-radius: 8px; padding: 8px 12px; }
.live .info { background: var(--sunken); }
.live .warn { background: var(--warn-bg); color: var(--warn); }
.live .bad { background: var(--bad-bg); color: var(--bad); }
.ack { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--bad); }
.ack input { width: 18px; height: 18px; margin-top: 2px; flex: none; accent-color: var(--bad); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; }
.chart { display: grid; gap: 8px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 2px; border-radius: 1px; }
.legend i.dash { background: none !important; border-top: 2px dashed var(--muted); height: 0; }
.plot { position: relative; min-width: 0; }
.plot svg { display: block; overflow: visible; }
.plot svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .axis { stroke: var(--muted); stroke-width: 1; opacity: 0.6; }
.plot .goal-line { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.plot .cross { stroke: var(--muted); stroke-width: 1; }
.plot .ring { stroke: var(--surface); stroke-width: 2; }
.plot .tick { fill: var(--muted); font-size: 11px; font-family: var(--f-num); }
.plot .dlabel { fill: var(--ink); font-size: 12px; font-weight: 500; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: grid; gap: 3px; min-width: 150px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12); z-index: 2; }
.tip[hidden] { display: none; }
.tip .row { display: flex; align-items: center; gap: 8px; }
.tip .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tip b { font-family: var(--f-num); font-weight: 500; }
details.tbl summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.tbl[open] summary { margin-bottom: 8px; }
.big-line { font-size: 16px; margin: 0; }
.big-line b { font-family: var(--f-num); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.6s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="label">감정이 아니라 계획으로</div>
      <h1>나의 매매일지</h1>
    </div>
    <button class="primary" id="newBuyBtn" type="button">+ 매수 기록하기</button>
  </header>

  <section class="goal" aria-label="목표 진행">
    <div class="goal-row">
      <div><div class="label">현재 총자산</div><div class="goal-big" id="goalNow">–</div></div>
      <div style="text-align:right"><div class="label">목표</div><div class="goal-big" id="goalTarget">100억</div></div>
    </div>
    <div class="bar" role="progressbar" aria-label="목표 달성률" id="goalBar"><i style="width:0%"></i></div>
    <div class="ticks"><span id="goalPct">0%</span><span id="goalLeft">자산은 ‘목표·자산’ 탭에서 기록해요</span></div>
  </section>

  <div class="notice" id="storeNotice" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="open" aria-selected="true">보유 중<span class="count" id="cntOpen"></span></button>
    <button role="tab" data-tab="closed" aria-selected="false">매매 기록<span class="count" id="cntClosed"></span></button>
    <button role="tab" data-tab="stats" aria-selected="false">통계·복기</button>
    <button role="tab" data-tab="goal" aria-selected="false">목표·자산</button>
    <button role="tab" data-tab="rules" aria-selected="false">내 원칙</button>
  </nav>

  <main id="view"></main>
</div>

<dialog id="buyDlg">
  <form class="dlg" id="buyForm" novalidate>
    <div class="dlg-head"><h2 id="bTitle">매수 기록</h2><button type="button" class="ghost" data-close>닫기</button></div>
    <div class="grid2">
      <label class="field"><span>종목명</span><input id="bName" required placeholder="예: 삼성전자"></label>
      <label class="field"><span>매수일</span><input id="bDate" type="date" required></label>
      <label class="field"><span>매수가 (원)</span><input id="bPrice" inputmode="decimal" required placeholder="72,000"></label>
      <label class="field"><span>수량 (주)</span><input id="bQty" inputmode="decimal" required placeholder="10"></label>
      <label class="field"><span>목표가 (원)</span><input id="bTarget" inputmode="decimal" placeholder="85,000"></label>
      <label class="field"><span>손절가 (원)</span><input id="bStop" inputmode="decimal" placeholder="66,000"></label>
    </div>
    <label class="field"><span>왜 사나요? (필수 · 3문장 이내로)</span><textarea id="bReason" required placeholder="실적 개선 근거, 왜 지금인지, 어떤 일이 생기면 틀린 것인지"></textarea></label>
    <div class="grid2">
      <label class="field"><span>지금 내 기분</span>
        <select id="bEmotion">
          <option>차분함</option><option>확신</option><option>불안</option><option>흥분</option><option>남들 따라(FOMO)</option><option>손실 만회하고 싶음</option>
        </select></label>
      <label class="field"><span>예상 보유 기간</span>
        <select id="bHorizon"><option>며칠</option><option>몇 주</option><option selected>몇 달</option><option>1년 이상</option></select></label>
    </div>
    <div class="checks" id="bChecks"><h3>매수 전 체크리스트</h3></div>
    <div class="live" id="bLive"></div>
    <label class="ack" id="bAckWrap" hidden><input type="checkbox" id="bAck"><span>원칙을 어긴다는 걸 알고 매수합니다. 이 매매는 ‘원칙 위반’으로 기록돼요.</span></label>
    <div class="actions"><button type="submit" class="primary" id="bSave">기록 저장</button><span class="hint" id="bErr"></span></div>
  </form>
</dialog>

<dialog id="sellDlg">
  <form class="dlg" id="sellForm" novalidate>
    <div class="dlg-head"><h2 id="sTitle">매도 기록</h2><button type="button" class="ghost" data-close>닫기</button></div>
    <div class="reason" id="sPlan"></div>
    <div class="grid2">
      <label class="field"><span>매도일</span><input id="sDate" type="date" required></label>
      <label class="field"><span>매도가 (원)</span><input id="sPrice" inputmode="decimal" required></label>
    </div>
    <label class="field"><span>왜 파나요?</span>
      <select id="sReason">
        <option value="target">목표가 도달 (계획대로)</option>
        <option value="stop">손절가 도달 (계획대로)</option>
        <option value="thesis">매수 이유가 깨짐 (계획대로)</option>
        <option value="emotion">불안하거나 조급해서 (감정)</option>
        <option value="cash">돈이 필요해서</option>
        <option value="other">기타</option>
      </select></label>
    <div class="live" id="sLive"></div>
    <label class="field"><span>복기 — 무엇을 배웠나요?</span><textarea id="sReview" placeholder="잘한 점, 아쉬운 점, 다음에 다르게 할 것"></textarea></label>
    <div class="actions"><button type="submit" class="primary">매도 저장</button><span class="hint" id="sErr"></span></div>
  </form>
</dialog>

<dialog id="addDlg">
  <form class="dlg" id="addForm" novalidate>
    <div class="dlg-head"><h2 id="aTitle">추가 매수</h2><button type="button" class="ghost" data-close>닫기</button></div>
    <div class="reason" id="aNow"></div>
    <div class="grid2">
      <label class="field"><span>매수일</span><input id="aDate" type="date" required></label>
      <label class="field"><span>매수가 (원)</span><input id="aPrice" inputmode="decimal" required></label>
      <label class="field"><span>추가 수량 (주)</span><input id="aQty" inputmode="decimal" required></label>
    </div>
    <label class="field"><span>왜 더 사나요? (필수)</span><textarea id="aReason" placeholder="처음 매수 이유가 여전히 맞는지, 무엇이 새로 확인됐는지"></textarea></label>
    <div class="live" id="aLive"></div>
    <label class="ack" id="aAckWrap" hidden><input type="checkbox" id="aAck"><span>원칙을 어긴다는 걸 알고 추가 매수합니다. ‘원칙 위반 추가 매수’로 기록돼요.</span></label>
    <div class="actions"><button type="submit" class="primary">추가 매수 저장</button><span class="hint" id="aErr"></span></div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script>
const DEFAULT_RULES = [
  "손절가를 미리 정했다",
  "이 종목을 사는 이유를 남에게 3문장으로 설명할 수 있다",
  "빚(신용·미수·대출)으로 사지 않는다",
  "최근 손실을 만회하려는 매수가 아니다",
  "실적·재무를 직접 확인했다",
];
const DEFAULT_SETTINGS = { rules: DEFAULT_RULES, capital: 0, maxWeight: 20, maxLossPct: 2, goal: 10000000000, currentAssets: 0 };
const EMOTION_RISKY = ["불안", "흥분", "남들 따라(FOMO)", "손실 만회하고 싶음"];
const SELL_LABEL = { target: "목표가 도달", stop: "손절가 도달", thesis: "매수 이유 깨짐", emotion: "감정적 매도", cash: "자금 필요", other: "기타" };
const PLANNED = ["target", "stop", "thesis"];

const state = { trades: [], assets: [], settings: { ...DEFAULT_SETTINGS }, tab: "open", store: "loading", sellId: null, editId: null, addId: null, confirmDel: null };
let tradesCol = null, assetsCol = null, settingsRef = null;

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
const parseNum = (v) => { const s = String(v ?? "").replace(/[^\d.\-]/g, ""); return s === "" ? null : Number(s); };
const won = (n) => n == null || isNaN(n) ? "–" : Math.round(n).toLocaleString("ko-KR") + "원";
function short(n) {
  if (n == null || isNaN(n)) return "–";
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e8) return s + (a / 1e8).toLocaleString("ko-KR", { maximumFractionDigits: 2 }) + "억";
  if (a >= 1e4) return s + Math.round(a / 1e4).toLocaleString("ko-KR") + "만";
  return s + Math.round(a).toLocaleString("ko-KR");
}
const pct = (n, d = 1) => n == null || !isFinite(n) ? "–" : (n > 0 ? "+" : "") + n.toFixed(d) + "%";
const sign = (n) => n > 0 ? "up" : n < 0 ? "down" : "";
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- 저장소 ---------- */
async function init() {
  render();
  if (!window.claude?.use) return storeDown("저장 기능을 쓸 수 없는 화면이에요. claude.ai에서 로그인한 상태로 열어 주세요.");
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  const uid = user ? await user.id() : null;

/* ---------- 계산 ---------- */
const openTrades = () => state.trades.filter((t) => t.status === "open").sort((a, b) => (b.buyDate || "").localeCompare(a.buyDate || ""));
const closedTrades = () => state.trades.filter((t) => t.status === "closed").sort((a, b) => (b.sellDate || "").localeCompare(a.sellDate || ""));
const pnl = (t) => (t.sellPrice - t.buyPrice) * t.qty;
const ret = (t) => (t.sellPrice / t.buyPrice - 1) * 100;

function summarize(list) {
  const n = list.length, wins = list.filter((t) => pnl(t) > 0), losses = list.filter((t) => pnl(t) < 0);
  const avg = (a, f) => a.length ? a.reduce((s, t) => s + f(t), 0) / a.length : null;
  return { n, winRate: n ? wins.length / n * 100 : null, total: list.reduce((s, t) => s + pnl(t), 0), avgRet: avg(list, ret), avgWin: avg(wins, ret), avgLoss: avg(losses, ret) };
}

function buyChecks() {
  const s = state.settings, price = parseNum($("bPrice").value), qty = parseNum($("bQty").value);
  const target = parseNum($("bTarget").value), stop = parseNum($("bStop").value);
  const out = { violations: [], warnings: [], infos: [] };
  $("bChecks").querySelectorAll("input[type=checkbox]").forEach((c) => { if (!c.checked) out.violations.push("체크 안 함: " + c.dataset.rule); });
  if (!stop) out.violations.push("손절가가 비어 있어요");
  if (price && qty) {
    const amount = price * qty;
    out.infos.push(`매수 금액 ${won(amount)}`);
    if (s.capital > 0) {
      const w = amount / s.capital * 100;
      (w > s.maxWeight ? out.violations : out.infos).push(`투자 원금 대비 비중 ${w.toFixed(1)}% (한도 ${s.maxWeight}%)`);
    }
    if (stop) {
      if (stop >= price) out.violations.push("손절가가 매수가보다 높거나 같아요");
      else {
        const loss = (price - stop) * qty;
        const lossPct = s.capital > 0 ? loss / s.capital * 100 : null;
        const msg = `손절 시 손실 ${won(loss)} (${pct(-(price - stop) / price * 100)})` + (lossPct != null ? `, 원금의 ${lossPct.toFixed(1)}%` : "");
        (lossPct != null && lossPct > s.maxLossPct ? out.violations : out.infos).push(msg + (lossPct != null && lossPct > s.maxLossPct ? ` — 한 번에 잃어도 되는 한도 ${s.maxLossPct}% 초과` : ""));
        if (target && target > price) {
          const rr = (target - price) / (price - stop);
          (rr < 2 ? out.warnings : out.infos).push(`손익비 ${rr.toFixed(1)} : 1` + (rr < 2 ? " — 2 : 1 이상을 권해요" : ""));
        }
      }
    }
  }
  if (!target) out.warnings.push("목표가가 비어 있어요. 언제 팔지 미리 정해 두면 흔들림이 줄어요");
  const emo = $("bEmotion").value;
  if (!state.editId && EMOTION_RISKY.includes(emo)) out.warnings.push(`지금 기분이 ‘${emo}’이에요. 하루 뒤에 다시 봐도 살 건가요?`);
  const t = state.editId && state.trades.find((x) => x.id === state.editId);
  if (t) {
    const firstStop = (t.originalPlan || t).stop;
    if (firstStop && (!stop || stop < firstStop)) out.warnings.unshift(`손절가를 처음 계획(${won(firstStop)})보다 낮추고 있어요. 손실을 키우는 가장 흔한 실수예요. 정말 이유가 있다면 매수 이유란에 함께 적어 두세요.`);
  }
  return out;
}
function renderBuyLive() {
  const c = buyChecks(), live = $("bLive");

function render() {
  const s = state.settings;
  const now = latestAssets().total || 0, goal = s.goal || DEFAULT_SETTINGS.goal;
  const p = Math.min(100, now / goal * 100);
  $("goalNow").textContent = now ? short(now) + "원" : "미입력";
  $("goalTarget").textContent = short(goal) + "원";
  $("goalBar").firstElementChild.style.width = p + "%";
  $("goalBar").setAttribute("aria-valuenow", p.toFixed(2));
  $("goalPct").textContent = now ? p.toFixed(2) + "% 달성" : "0%";
  $("goalLeft").textContent = now ? `남은 거리 ${short(goal - now)}원` : "자산은 ‘목표·자산’ 탭에서 기록해요";
  $("cntOpen").textContent = openTrades().length || "";
  $("cntClosed").textContent = closedTrades().length || "";
  $("newBuyBtn").disabled = state.store !== "ready";
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const view = $("view");
  const active = document.activeElement;
  if ((state.tab === "rules" || state.tab === "goal") && view.contains(active) && active.matches("input,textarea")) return; // 입력 중엔 다시 그리지 않음
  view.replaceChildren(state.tab === "open" ? viewOpen() : state.tab === "closed" ? viewClosed() : state.tab === "stats" ? viewStats() : state.tab === "goal" ? viewGoal() : viewRules());
}

      el("thead", {}, el("tr", {}, ["기분", "매매 수", "승률", "평균 수익률", "실현 손익"].map((h) => el("th", { text: h })))),

  $("bSave").textContent = t ? "수정 저장" : "기록 저장";
  const box = $("bChecks"); box.replaceChildren(el("h3", { text: "매수 전 체크리스트" }));
  box.hidden = !!t; // 체크리스트는 매수 시점의 기록이라 수정하지 않음
  if (t) {
    const fmt = (n) => n == null ? "" : Number(n).toLocaleString("ko-KR");
    $("bName").value = t.name; $("bDate").value = t.buyDate; $("bPrice").value = fmt(t.buyPrice); $("bQty").value = fmt(t.qty);
    $("bTarget").value = fmt(t.target); $("bStop").value = fmt(t.stop); $("bReason").value = t.reason;
    $("bEmotion").value = t.emotion || "차분함"; $("bHorizon").value = t.horizon || "몇 달";
  } else {
    $("bDate").value = today();
    state.settings.rules.forEach((r, i) => box.append(el("label", {}, el("input", { type: "checkbox", id: "chk-" + i, "data-rule": r }), el("span", { text: r }))));
  }
  renderBuyLive(); $("buyDlg").showModal();
}
$("buyForm").addEventListener("input", renderBuyLive);
$("buyForm").addEventListener("change", renderBuyLive);
$("buyForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("bName").value.trim(), price = parseNum($("bPrice").value), qty = parseNum($("bQty").value), reason = $("bReason").value.trim();
  if (!name || !price || !qty || !reason || !$("bDate").value) { $("bErr").textContent = "종목명, 매수일, 매수가, 수량, 매수 이유는 꼭 적어 주세요."; return; }
  const c = renderBuyLive();
  if (state.editId) return saveEdit({ name, buyDate: $("bDate").value, buyPrice: price, qty, target: parseNum($("bTarget").value), stop: parseNum($("bStop").value), reason, emotion: $("bEmotion").value, horizon: $("bHorizon").value });
  if (c.violations.length && !$("bAck").checked) { $("bErr").textContent = "원칙 위반 항목이 있어요. 그래도 산다면 아래 확인란에 체크해 주세요."; return; }
  const checks = {}; $("bChecks").querySelectorAll("input[type=checkbox]").forEach((x) => checks[x.dataset.rule] = x.checked);
  const ok = await write(() => tradesCol.add({
    name, buyDate: $("bDate").value, buyPrice: price, qty, target: parseNum($("bTarget").value), stop: parseNum($("bStop").value),
    reason, emotion: $("bEmotion").value, horizon: $("bHorizon").value, checks, violations: c.violations, warnings: c.warnings,
    status: "open", createdAt: new Date().toISOString(),
  }), "매수 기록을 저장했어요");
  if (ok) { $("buyDlg").close(); state.tab = "open"; render(); }
});

async function saveEdit(next) {
  const t = state.trades.find((x) => x.id === state.editId); if (!t) return;
  const changed = Object.keys(EDIT_FIELDS).filter((k) => (next[k] ?? null) !== (t[k] ?? null));
  if (!changed.length) { $("buyDlg").close(); return; }
  const show = (k, v) => v == null || v === "" ? "없음" : ["buyPrice", "target", "stop"].includes(k) ? won(v) : k === "reason" ? "(내용 변경)" : String(v);
  const summary = changed.map((k) => `${EDIT_FIELDS[k]} ${show(k, t[k])} → ${show(k, next[k])}`).join(", ");
  const patch = { ...next, edits: [...(t.edits || []), { at: new Date().toISOString(), summary }] };
  if (!t.originalPlan) patch.originalPlan = { target: t.target ?? null, stop: t.stop ?? null, buyPrice: t.buyPrice, qty: t.qty };
  const ok = await write(() => tradesCol.doc(t.id).update(patch), "수정했어요");
  if (ok) { $("buyDlg").close(); state.editId = null; }
}

function openAdd(id) {
  const t = state.trades.find((x) => x.id === id); if (!t) return;
  state.addId = id; $("addForm").reset(); $("aDate").value = today(); $("aErr").textContent = "";
  $("aTitle").textContent = `${t.name} 추가 매수`;
  $("aNow").textContent = `지금 — 평균 매수가 ${won(t.buyPrice)}, ${t.qty.toLocaleString("ko-KR")}주, 손절가 ${t.stop ? won(t.stop) : "없음"}\n처음 산 이유: ${t.reason}`;
  if (t.currentPrice) $("aPrice").value = t.currentPrice.toLocaleString("ko-KR");
  renderAddLive(); $("addDlg").showModal();
}
function addChecks() {
  const t = state.trades.find((x) => x.id === state.addId), s = state.settings;
  const price = parseNum($("aPrice").value), qty = parseNum($("aQty").value);
  const out = { violations: [], warnings: [], infos: [] };
  if (!t || !price || !qty) return out;
  const newQty = t.qty + qty, avg = (t.buyPrice * t.qty + price * qty) / newQty;
  out.infos.push(`평균 매수가 ${won(t.buyPrice)} → ${won(avg)}, 수량 ${t.qty.toLocaleString("ko-KR")}주 → ${newQty.toLocaleString("ko-KR")}주`);
  if (t.stop && price <= t.stop) out.violations.push(`손절가(${won(t.stop)}) 이하에서 사고 있어요. 계획대로라면 정리할 가격이에요`);
  else if (price < t.buyPrice) out.warnings.push(`물타기예요 (평균 매수가보다 ${pct((price / t.buyPrice - 1) * 100)}). 처음 매수 이유가 여전히 맞을 때만 하세요. 손실을 만회하려는 마음이라면 멈추세요.`);
  if (s.capital > 0) {
    const w = avg * newQty / s.capital * 100;
    (w > s.maxWeight ? out.violations : out.infos).push(`추가 후 비중 ${w.toFixed(1)}% (한도 ${s.maxWeight}%)`);
  }
  if (t.stop && t.stop < avg) {
    const loss = (avg - t.stop) * newQty, lp = s.capital > 0 ? loss / s.capital * 100 : null, over = lp != null && lp > s.maxLossPct;
    (over ? out.violations : out.infos).push(`추가 후 손절하면 손실 ${won(loss)}` + (lp != null ? `, 원금의 ${lp.toFixed(1)}%` : "") + (over ? ` — 한도 ${s.maxLossPct}% 초과` : ""));
  }
  return out;
}
function renderAddLive() {
  const c = addChecks();
  $("aLive").replaceChildren(
    ...c.violations.map((m) => el("div", { class: "bad", text: "✕ " + m })),
    ...c.warnings.map((m) => el("div", { class: "warn", text: "! " + m })),
    ...c.infos.map((m) => el("div", { class: "info", text: m })),
  );
  $("aAckWrap").hidden = c.violations.length === 0;
  if (!c.violations.length) $("aAck").checked = false;
  return c;
}
$("addForm").addEventListener("input", renderAddLive);
$("addForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const t = state.trades.find((x) => x.id === state.addId); if (!t) return;
  const price = parseNum($("aPrice").value), qty = parseNum($("aQty").value), reason = $("aReason").value.trim();
  if (!price || !qty || !reason || !$("aDate").value) { $("aErr").textContent = "매수일, 매수가, 수량, 추가 매수 이유는 꼭 적어 주세요."; return; }
  const c = renderAddLive();
  if (c.violations.length && !$("aAck").checked) { $("aErr").textContent = "원칙 위반 항목이 있어요. 그래도 산다면 아래 확인란에 체크해 주세요."; return; }
  const newQty = t.qty + qty;
  const patch = {
    buyPrice: (t.buyPrice * t.qty + price * qty) / newQty, qty: newQty,
    adds: [...(t.adds || []), { date: $("aDate").value, price, qty, reason, averagingDown: price < t.buyPrice, violations: c.violations, at: new Date().toISOString() }],
  };
  if (!t.initialBuy) patch.initialBuy = { date: t.buyDate, price: t.buyPrice, qty: t.qty };
  const ok = await write(() => tradesCol.doc(t.id).update(patch), "추가 매수를 저장했어요");
  if (ok) $("addDlg").close();
});
$("addDlg").addEventListener("close", () => { state.addId = null; });

function openSell(id) {
  const t = state.trades.find((x) => x.id === id); if (!t) return;
  state.sellId = id; $("sellForm").reset(); $("sDate").value = today(); $("sErr").textContent = "";
  $("sTitle").textContent = `${t.name} 매도 기록`;
  $("sPlan").textContent = `처음 계획 — 목표가 ${t.target ? won(t.target) : "없음"}, 손절가 ${t.stop ? won(t.stop) : "없음"}\n산 이유: ${t.reason}`;
  if (t.currentPrice) $("sPrice").value = t.currentPrice.toLocaleString("ko-KR");
  renderSellLive(); $("sellDlg").showModal();
}
function renderSellLive() {
  const t = state.trades.find((x) => x.id === state.sellId), price = parseNum($("sPrice").value), live = $("sLive");
  if (!t || !price) return live.replaceChildren();
  const p = (price - t.buyPrice) * t.qty, out = [el("div", { class: "info" }, "예상 결과 ", el("span", { class: "num " + sign(p), text: `${pct((price / t.buyPrice - 1) * 100)} (${won(p)})` }))];
  const why = $("sReason").value;
  if (why === "emotion") out.push(el("div", { class: "warn", text: "! 감정적 매도로 기록돼요. 처음 계획에서 무엇이 달라졌는지 복기에 꼭 적어 두세요." }));
  if (t.stop && price < t.stop) out.push(el("div", { class: "bad", text: `✕ 손절가(${won(t.stop)})보다 낮은 가격이에요. 늦은 손절로 기록돼요.` }));
  live.replaceChildren(...out);
}
$("sellForm").addEventListener("input", renderSellLive);
$("sellForm").addEventListener("change", renderSellLive);
$("sellForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const price = parseNum($("sPrice").value);
  if (!price || !$("sDate").value) { $("sErr").textContent = "매도일과 매도가를 적어 주세요."; return; }
  const ok = await write(() => tradesCol.doc(state.sellId).update({
    status: "closed", sellDate: $("sDate").value, sellPrice: price, sellReason: $("sReason").value, review: $("sReview").value.trim(),
  }), "매도 기록을 저장했어요");
  if (ok) { $("sellDlg").close(); state.tab = "closed"; render(); }
});

document.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));
$("newBuyBtn").addEventListener("click", () => openBuy());
$("buyDlg").addEventListener("close", () => { state.editId = null; });
document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; state.confirmDel = null; render();
  try { localStorage.setItem("journal-tab", state.tab); } catch {}
});
$("view").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "new") openBuy();
  else if (act === "sell") openSell(id);
  else if (act === "edit") openBuy(id);
  else if (act === "add") openAdd(id);
  else if (act === "asset-save") {
    const month = $("astMonth").value, total = parseNum($("astTotal").value), invest = parseNum($("astInvest").value);
    if (!/^\d{4}-\d{2}$/.test(month) || !total) { $("astErr").textContent = "기록할 달과 총자산을 적어 주세요."; return; }
    b.blur();
    await write(() => assetsCol.doc(month).set({ month, total, invest: invest ?? 0, memo: $("astMemo").value.trim(), savedAt: new Date().toISOString() }),
      `${month.replace("-", "년 ")}월 자산을 저장했어요`);
  }
  else if (act === "asset-del") { state.confirmDel = "ast-" + id; render(); }
  else if (act === "asset-del-yes") { state.confirmDel = null; await write(() => assetsCol.doc(id).delete(), "자산 기록을 지웠어요"); }
  else if (act === "sim-fill") {
    const la = latestAssets(), fmt = (v) => (v ? Number(v).toLocaleString("ko-KR") : "");
    $("simTotal").value = fmt(la.total); $("simInvest").value = fmt(la.invest);
    updateSim(); saveSim();
  }
  else if (act === "del") { state.confirmDel = id; render(); }
  else if (act === "del-no") { state.confirmDel = null; render(); }
  else if (act === "del-yes") { state.confirmDel = null; await write(() => tradesCol.doc(id).delete(), "기록을 지웠어요"); }
  else if (act === "rule-add") { const list = $("ruleList"), row = ruleRow("", list.children.length); list.append(row); row.querySelector("input").focus(); }
  else if (act === "rule-del") b.closest(".rule-row").remove();
  else if (act === "save-settings") {
    const rules = [...document.querySelectorAll("[data-rule-input]")].map((i) => i.value.trim()).filter(Boolean);
    const num = (id, d) => parseNum($(id).value) ?? d;
    const next = { rules, capital: num("setCapital", 0), maxWeight: num("setMaxWeight", 20), maxLossPct: num("setMaxLoss", 2), currentAssets: num("setAssets", 0), goal: num("setGoal", DEFAULT_SETTINGS.goal) || DEFAULT_SETTINGS.goal };
    b.blur();
    await write(() => settingsRef.set(next), "원칙과 기준을 저장했어요");
  }
});
$("view").addEventListener("change", async (e) => {
  const inp = e.target.closest("[data-cur]"); if (!inp) return;
  const v = parseNum(inp.value), t = state.trades.find((x) => x.id === inp.dataset.cur);
  if (!t || (v ?? null) === (t.currentPrice ?? null)) return;
  inp.blur();
  await write(() => tradesCol.doc(t.id).update({ currentPrice: v }));
});

function updateSim() { const out = $("simOut"); if (out) out.replaceChildren(simOutput(readSim())); }
async function saveSim() {
  if (!settingsRef) return;
  const sim = readSim();
  if (JSON.stringify(sim) === JSON.stringify(state.settings.sim)) return;
  await write(() => settingsRef.set({ ...state.settings, sim }));
}
$("view").addEventListener("input", (e) => { if (e.target.closest("#simForm")) updateSim(); });
$("view").addEventListener("change", (e) => { if (e.target.closest("#simForm")) saveSim(); });

try { const saved = localStorage.getItem("journal-tab"); if (["open", "closed", "stats", "goal", "rules"].includes(saved)) state.tab = saved; } catch {}
init();
</script>
